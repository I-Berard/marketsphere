spring.application.name=marketsphere
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/market_sphere}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.pool-name=marketsphere-hikari

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=market_sphere
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.jdbc.batch_size=25

spring.flyway.enabled=true
spring.flyway.schemas=market_sphere
spring.flyway.default-schema=market_sphere
spring.flyway.create-schemas=true
spring.flyway.locations=classpath:db/migration

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2s
spring.data.redis.connect-timeout=2s
spring.data.redis.repositories.enabled=false

logging.level.root=INFO
logging.level.rw.ac.rca.marketsphere=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.data.repository.config=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.connections.pooling=WARN
logging.level.io.netty.resolver.dns=ERROR
logging.level.org.springdoc.core.events=ERROR

spring.jackson.default-property-inclusion=non_null

management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.prometheus.metrics.export.enabled=true
management.info.env.enabled=false
management.observations.key-values.application=marketsphere

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui
springdoc.swagger-ui.operations-sorter=method
springdoc.show-actuator=false

marketsphere.jwt.secret=${JWT_SECRET:marketsphere-dev-only-change-me-to-a-64-char-secret-key!!}
marketsphere.jwt.issuer=marketsphere
marketsphere.jwt.ttl=PT8H
marketsphere.lockout.max-attempts=3
marketsphere.lockout.duration=PT30M
marketsphere.payment.stub-mode=${PAYMENT_STUB_MODE:SUCCESS}
marketsphere.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}
marketsphere.seed.enabled=true
