services:
  postgres:
    image: postgres:16-alpine
    container_name: marketsphere-postgres
    environment:
      POSTGRES_DB: marketsphere
      POSTGRES_USER: marketsphere
      POSTGRES_PASSWORD: marketsphere
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - marketsphere-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketsphere -d marketsphere"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: marketsphere-redis
    ports:
      - "${REDIS_PUBLISH_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    profiles: ["app"]
    build: .
    container_name: marketsphere-api
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/marketsphere
      DATABASE_USERNAME: marketsphere
      DATABASE_PASSWORD: marketsphere
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-marketsphere-dev-only-change-me-to-a-64-char-secret-key!!}
      PAYMENT_STUB_MODE: ${PAYMENT_STUB_MODE:-SUCCESS}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  marketsphere-pg:
